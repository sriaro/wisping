[package]
name = "wisping"
version = "1.0.1"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-only"
authors = ["sriaro"]
description = "Cleaner, startup, programs and disk usage tool for Windows"
repository = "https://github.com/sriaro/wisping"

[[bin]]
name = "Wisping"
path = "src/main.rs"
test = false
bench = false

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-winit-030", "software-renderer-path", "compat-1-18", "unstable-fontique-011", "image-default-formats"] }
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Wdk_Foundation", "Wdk_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_UI_Controls", "Win32_Storage_FileSystem", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Com", "Win32_System_Restore", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange"] }

blake3 = "1.8.7"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[patch.crates-io]
femtovg = { path = "third_party/femtovg" }
i-slint-renderer-femtovg = { path = "third_party/i-slint-renderer-femtovg" }
