[package]
edition = "2024"
rust-version = "1.92"
name = "i-slint-renderer-femtovg"
version = "1.18.1"
authors = ["Slint Developers <info@slint.dev>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "FemtoVG based renderer for Slint"
homepage = "https://slint.dev"
readme = "README.md"
license = "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0"
repository = "https://github.com/slint-ui/slint"

[features]
default = []
opengl = []

[lib]
test = false
doctest = false
bench = false
name = "i_slint_renderer_femtovg"
path = "lib.rs"

[dependencies.cfg-if]
version = "1"

[dependencies.const-field-offset]
version = "0.2.1"

[dependencies.femtovg]
version = "0.27"
features = ["swash"]
default-features = false

[dependencies.glow]
version = "0.18"

[dependencies.i-slint-common]
version = "=1.18.1"
features = [
    "default",
    "shared-fontique",
]
default-features = false

[dependencies.i-slint-core]
version = "=1.18.1"
features = [
    "default",
    "box-shadow-cache",
    "shared-fontique",
    "shared-parley",
]
default-features = false

[dependencies.i-slint-core-macros]
version = "=1.18.1"
features = ["default"]
default-features = false

[dependencies.imgref]
version = "1.6.1"

[dependencies.lyon_path]
version = "1.0"
default-features = false

[dependencies.pin-weak]
version = "1"

[dependencies.rgb]
version = "0.8.27"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.i-slint-core]
version = "=1.18.1"
features = [
    "image-decoders",
    "svg",
]
default-features = false
