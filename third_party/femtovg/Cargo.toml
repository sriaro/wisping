[package]
edition = "2021"
rust-version = "1.88"
name = "femtovg"
version = "0.27.0"
authors = [
    "Peter Todorov <ptodorov@cytec.bg>",
    "Adam Nemecek <adamnemecek@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Antialiased 2D vector drawing library"
keywords = [
    "graphics",
    "canvas",
    "vector",
    "drawing",
    "gpu",
]
categories = ["graphics"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/femtovg/femtovg"

[features]
swash = ["dep:swash"]

[lib]
test = false
doctest = false
bench = false
name = "femtovg"
path = "src/lib.rs"

[dependencies.bitflags]
version = "2.6.0"

[dependencies.bytemuck]
version = "1.16"
features = ["derive"]

[dependencies.fnv]
version = "1.0.7"

[dependencies.glow]
version = "0.18.0"
default-features = false

[dependencies.imgref]
version = "1.11.0"

[dependencies.rgb]
version = "0.8.50"

[dependencies.slotmap]
version = "1.0.7"

[dependencies.swash]
version = "0.2.6"
optional = true
